name: CI/CD
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: hashicorp/setup-terraform@v3
    - run: terraform fmt -check -recursive
    - run: terraform init -backend=false
    - run: terraform validate
    - uses: actions/setup-node@v4
      with: {node-version: 22}
    - run: |
        for service in catalog orders payments users notifications gateway; do (cd services/$service && npm install --package-lock-only); done
  build:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix: {service: [catalog, orders, payments, users, notifications, gateway]}
    steps:
    - uses: actions/checkout@v4
    - uses: docker/build-push-action@v6
      with: {context: services/${{ matrix.service }}, push: false, tags: platform/${{ matrix.service }}:${{ github.sha }}}
