apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: platform
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: gateway
        image: ghcr.io/example/platform/gateway:latest
        ports: [{containerPort: 3000}]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 500m, memory: 512Mi}
        envFrom: [{configMapRef: {name: platform-config}}, {secretRef: {name: platform-secrets}}]
        readinessProbe: {httpGet: {path: /readyz, port: 3000}, initialDelaySeconds: 5}
        livenessProbe: {httpGet: {path: /healthz, port: 3000}, initialDelaySeconds: 10}
