apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform
  namespace: platform
spec:
  ingressClassName: nginx
  rules:
  - host: platform.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service: {name: gateway, port: {number: 80}}
